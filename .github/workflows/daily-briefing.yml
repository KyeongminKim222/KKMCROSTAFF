name: Daily CRO Staff Briefing

on:
  schedule:
    - cron: '7 22 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send the Gmail briefing after a successful deploy'
        type: boolean
        default: true
      force_regenerate:
        description: 'Regenerate even if today''s briefing already exists (overwrites docs/briefing.json)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-cro-staff-briefing
  cancel-in-progress: false

jobs:
  generate-deploy-email:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Prevent duplicate emails: if today's briefing already exists on main,
      # skip the whole pipeline (including the email step). Manual runs with
      # force_regenerate=true bypass this guard.
      - name: Skip if today's briefing already exists
        id: dupguard
        env:
          FORCE_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_regenerate == true && '1' || '0' }}
        run: |
          TODAY=$(TZ=Asia/Seoul date +%F)
          SKIP=true
          if [ "$FORCE_REGENERATE" = "1" ]; then
            echo "force_regenerate requested. Proceeding regardless of existing briefing."
            SKIP=false
          elif [ ! -f docs/briefing.json ]; then
            echo "No briefing.json found on main. Proceeding."
            SKIP=false
          else
            EXISTING=$(node -e "const b=require('./docs/briefing.json'); console.log((b.meta&&b.meta.briefing_date)||'')")
            if [ "$EXISTING" != "$TODAY" ]; then
              echo "No briefing for $TODAY yet (current: $EXISTING). Proceeding."
              SKIP=false
            else
              echo "Briefing for $TODAY already exists. Skipping the rest to avoid a duplicate email."
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Generate researched briefing
        if: steps.dupguard.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          OPENAI_MODEL_RESEARCH: ${{ vars.OPENAI_MODEL_RESEARCH || vars.OPENAI_MODEL || 'gpt-5.4-mini' }}
          OPENAI_MODEL_SCORING: ${{ vars.OPENAI_MODEL_SCORING || 'gpt-5.4-mini' }}
          OPENAI_MODEL_WRITING: ${{ vars.OPENAI_MODEL_WRITING || 'gpt-5.4' }}
          FORCE_REGENERATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_regenerate == true && '1' || '0' }}
        run: node scripts/generate-daily-briefing.mjs

      - name: Commit briefing data
        if: steps.dupguard.outputs.skip != 'true'
        run: |
          git config user.name "CRO Staff Automation"
          git config user.email "actions@users.noreply.github.com"
          git add docs/briefing.json docs/briefing_history
          git commit -m "Update daily CRO Staff briefing" || exit 0
          git push

      # GitHub Pages (Source: main /docs) is deployed by the automatic 'pages-build-deployment' workflow after the push above.
      # Poll the published briefing.json until it carries today's briefing_date; the email goes out only after that.
      - name: Wait for GitHub Pages deploy
        if: steps.dupguard.outputs.skip != 'true'
        env:
          PAGES_BASE_URL: ${{ vars.PAGES_BASE_URL || 'https://kyeongminkim222.github.io/KKMCROSTAFF/' }}
        run: |
          EXPECTED_DATE=$(node -e "console.log(require('./docs/briefing.json').meta.briefing_date)")
          PAGES_JSON_URL="${PAGES_BASE_URL%/}/briefing.json"
          for attempt in $(seq 1 45); do
            BODY=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${PAGES_JSON_URL}?t=$(date +%s)" || true)
            DEPLOYED_DATE=$(printf '%s' "$BODY" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log((JSON.parse(s).meta||{}).briefing_date||'')}catch{console.log('')}})")
            if [ "$DEPLOYED_DATE" = "$EXPECTED_DATE" ]; then
              echo "GitHub Pages published briefing date $EXPECTED_DATE at $PAGES_JSON_URL"
              exit 0
            fi
            echo "Waiting for GitHub Pages deploy ($attempt/45): expected=$EXPECTED_DATE published=$DEPLOYED_DATE"
            sleep 20
          done
          echo "GitHub Pages did not publish the new briefing in time. Email not sent."
          exit 1

      - name: Wait until 07:00 KST for scheduled delivery
        if: github.event_name == 'schedule' && steps.dupguard.outputs.skip != 'true'
        run: |
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          TARGET=$(TZ=Asia/Seoul date -d "$TODAY_KST 07:00:00" +%s)
          NOW=$(date +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            WAIT_SECONDS=$((TARGET - NOW))
            echo "Briefing is ready. Waiting ${WAIT_SECONDS}s until 07:00 KST."
            sleep "$WAIT_SECONDS"
          else
            echo "It is already after 07:00 KST. Sending immediately."
          fi

      - name: Send Gmail briefing email
        if: ${{ steps.dupguard.outputs.skip != 'true' && (github.event_name != 'workflow_dispatch' || inputs.send_email == true) }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_TO_BANK: ${{ secrets.EMAIL_TO_BANK }}
          EMAIL_TO_CARD_CAPITAL: ${{ secrets.EMAIL_TO_CARD_CAPITAL }}
          EMAIL_TO_INSURANCE: ${{ secrets.EMAIL_TO_INSURANCE }}
          EMAIL_TO_SECURITIES_AM: ${{ secrets.EMAIL_TO_SECURITIES_AM }}
          REPORT_URL: ${{ vars.PAGES_BASE_URL || 'https://kyeongminkim222.github.io/KKMCROSTAFF/' }}
        run: python scripts/send-gmail.py --all-editions
